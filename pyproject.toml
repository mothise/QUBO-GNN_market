[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "QUBO-GNN_market"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "networkx",
    "pandas",
]

[project.optional-dependencies]
gnn = ["torch", "torch_geometric"]
exact = ["gurobipy", "ortools"]

[tool.setuptools]
packages = ["shared", "dense_tier", "dense_tier.experiments", "sparse_tier"]
